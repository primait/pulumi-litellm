[project]
  name = "pulumi_litellm"
  description = "pulumi provider of the litellm TF provider github.com/BerriAI/terraform-provider-litellm"
  dependencies = ["packaging>=24.0", "pulumi>=3.269.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["litellm", "category/cloud"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.0.1"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://www.pulumi.com"
    Repository = "https://github.com/primait/pulumi-litellm"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_litellm = ["py.typed", "pulumi-plugin.json"]
