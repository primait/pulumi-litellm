name: license_check

on:
  workflow_call:
    inputs: {}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PULUMI_GO_DEP_ROOT: ${{ github.workspace }}/..
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PULUMI_PULUMI_ENABLE_JOURNALING: "true"
  TF_APPEND_USER_AGENT: pulumi

permissions:
  contents: read

jobs:
  license_check:
    name: License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false      
      - name: Setup mise
        uses: jdx/mise-action@8d3b0ba20a9cea7b883d922ea958553c941ab082
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2026.10.21
          add_shims_to_path: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # only saving the cache in the prerequisites job
          cache_save: false
      - name: Install project dependencies
        run: mise deps install
      - run: make prepare_local_workspace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pulumi/license-check-action@main
        continue-on-error: true
        with:
          module-path: provider
          ignore-modules: >-
            github.com/aead/chacha20,
            github.com/apache/arrow/go/v12,
            github.com/apache/thrift/lib/go/thrift,
            github.com/cloudflare/circl,
            github.com/golang,
            github.com/gorhill/cronexpr,
            github.com/in-toto/in-toto-golang,
            github.com/jmespath/go-jmespath,
            github.com/keybase/go-crypto,
            github.com/klauspost/compress,
            github.com/mattn/go-localereader,
            github.com/modern-go/reflect2,
            github.com/pierrec/lz4,
            github.com/pjbgf/sha1cd,
            github.com/pulumi,
            github.com/segmentio/asm,
            golang.org
