# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumi/ci-mgmt
name: Attach provider to GitHub release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      setLatestRelease:
        required: true
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PULUMI_GO_DEP_ROOT: ${{ github.workspace }}/..
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  TF_APPEND_USER_AGENT: pulumi

permissions:
  contents: read

jobs:
  publish:
    name: Attach provider assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROVIDER_VERSION: ${{ inputs.version }}
    steps:
    - name: Validate prerelease
      if: contains(inputs.version, '-') || contains(inputs.version, '+')
      run: echo "Can't publish a prerelease version as a stable release. This is likely a bug in the calling workflow." && exit 1
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false    
    - name: Setup mise
      uses: jdx/mise-action@8d3b0ba20a9cea7b883d922ea958553c941ab082
      env:
        MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
      with:
        version: 2026.10.21
        add_shims_to_path: false
        github_token: ${{ secrets.GITHUB_TOKEN }}
        cache_save: false
    - name: Install project dependencies
      run: mise deps install
    - name: Create dist directory
      run: mkdir -p dist
    - name: Download provider assets
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: pulumi-resource-litellm-v${{ inputs.version }}-*
        path: dist
        # Don't create a directory for each artifact
        merge-multiple: true
    - name: Download schema
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: schema-embed.*
        merge-multiple: true
        path: dist
    - name: Verify release assets
      shell: bash
      run: |
        for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
          archive="dist/pulumi-resource-litellm-v$PROVIDER_VERSION-$platform.tar.gz"
          if [[ ! -s "$archive" ]]; then
            echo "::error::Missing or empty provider archive: $archive"
            exit 1
          fi
        done
    - name: Calculate checksums
      working-directory: dist
      run: shasum ./*.tar.gz > "pulumi-litellm_${{ inputs.version }}_checksums.txt"
    - name: Get Schema Change Summary
      id: schema-summary
      shell: bash
      run: |
        LAST_VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
        {
          echo 'summary<<EOF'
          if [[ -n "$LAST_VERSION" ]]; then
            schema-tools compare -r github://api.github.com/primait -p litellm -o "$LAST_VERSION" --new-path=provider/cmd/pulumi-resource-litellm/schema.json
          else
            echo "Initial stable release; no previous schema to compare."
          fi
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
    - name: Create GH Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        tag_name: v${{ inputs.version }}
        prerelease: false
        draft: false
        # Explicitly set make_latest to account for backported releases
        make_latest: ${{ inputs.setLatestRelease }}
        body: ${{ steps.schema-summary.outputs.summary }}
        generate_release_notes: true
        files: dist/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  clean_up_release_labels:
    name: Clean up release labels
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false    
    - name: Clean up release labels
      uses: pulumi/action-release-by-pr-label@main
      with:
        command: "clean-up-release-labels"
        repo: ${{ github.repository }}
        commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
